function sa(f){sel=new Set(f?T.map((_,k)=>k):[]);home()}
function home(){
 const c=T.map((_,k)=>Q.filter(q=>q[0]==k).length);
 R.innerHTML=`<h1>第三章 敏捷專案管理架構</h1><p class="mu">共 ${Q.length} 題・選標籤練題型（不選＝全部）</p>
 <div class="chips">${T.map((t,k)=>`<button class="chip ${sel.has(k)?'on':''}" onclick="tg(${k})">${t} <small>${c[k]}</small></button>`).join('')}</div>
 <div class="row"><button onclick="sa(1)">全選</button><button onclick="sa(0)">清除</button>
 <select onchange="N=+this.value">${[10,20,0].map(n=>`<option value="${n}" ${N==n?'selected':''}>${n?n+' 題':'全部'}</option>`).join('')}</select></div>
 <button class="pri" onclick="go()">開始練習</button>
 <button class="sec" onclick="book()">錯題本（${Object.keys(W).length} 題）</button>
 <button class="sec" onclick="rec()">📊 學習紀錄</button>
 ${H.length?'<h2>最近成績</h2>'+H.slice(-5).reverse().map(h=>`<div class="li">${h.d}｜${h.t}｜<b>${h.s}/${h.n}</b>（${Math.round(h.s/h.n*100)}%）</div>`).join(''):''}`;
}
function go(){
 const ids=Q.map((_,i)=>i).filter(i=>!sel.size||sel.has(Q[i][0]));
 const p=shuf(ids).slice(0,N||ids.length);
 start(p,'n',sel.size&&sel.size<T.length?[...sel].map(k=>T[k]).join('、'):'全部標籤');
}
function start(ids,m,t){S={qs:ids.map(mk),k:0,sc:0,bad:[],m,t,done:0};show()}
function show(){
 S.p=null;
 const x=S.qs[S.k],q=Q[x.i];
 R.innerHTML=`<div class="mu">第 ${S.k+1} / ${S.qs.length} 題・目前 ${S.sc} 分 <span class="tag">${T[q[0]]}</span></div>
 <div class="bar"><i style="width:${S.k/S.qs.length*100}%"></i></div>
 <div class="q">${q[1]}</div>
 ${x.s.map((o,j)=>`<button class="o" onclick="ans(${j})">${j+1}. ${o}</button>`).join('')}<div class="mu" style="margin-top:6px">⌨️ 按 1–4 選擇答案，Enter 確認／下一題</div><div id="fb"></div>
 <button class="sec" onclick="home()" style="margin-top:20px">放棄並回首頁</button>`;
}
function ans(j){
 if(S.done)return;S.done=1;
 const x=S.qs[S.k],q=Q[x.i],ok=j==x.a,b=R.querySelectorAll('.o');
 b[x.a].classList.add('ok');if(!ok)b[j].classList.add('no');
 const tk=q[0];ST[tk]=ST[tk]||{a:0,c:0};ST[tk].a++;if(ok)ST[tk].c++;
 if(ok){S.sc++;if(S.m=='b')delete W[x.i]}else{S.bad.push(x);W[x.i]=(W[x.i]||0)+1}
 sv();
 document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✔ 答對了':'✘ 答錯了，正解：'+(x.a+1)}${ex(x.i)}</div><button class="pri" onclick="nx()">${S.k+1<S.qs.length?'下一題':'看成績'}</button>`;
}
function nx(){S.done=0;S.k++;S.k<S.qs.length?show():fin()}
function fin(){
 const n=S.qs.length,d=new Date();
 H.push({d:(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),t:S.m=='b'?'錯題本':S.t,s:S.sc,n});H=H.slice(-100);sv();setTimeout(rec,400);
 R.innerHTML=`<h1>練習結果</h1><div class="sc">${S.sc} / ${n}</div><p class="mu" style="text-align:center">答對率 ${Math.round(S.sc/n*100)}%</p>
 ${S.bad.length?'<h2>本次錯題</h2>'+S.bad.map(x=>`<div class="li"><span class="tag">${T[Q[x.i][0]]}</span><br>${Q[x.i][1]}<br><b style="color:var(--ok)">正解：${x.s[x.a]}</b>${ex(x.i)}</div>`).join('')+`<button class="pri" onclick="start(S.bad.map(x=>x.i),'b')">重練這些錯題</button>`:'<p>全部答對！🎉</p>'}
 <button class="sec" onclick="home()">回首頁</button>`;
}
function rec(){
 cl();let a=0,c=0;Object.values(ST).forEach(v=>{a+=v.a;c+=v.c});
 const m=document.createElement('div');m.id='md';m.className='md';
 m.innerHTML=`<div class="bx"><h1>📊 學習紀錄</h1><p class="mu">僅儲存在這個裝置的這個瀏覽器</p>
 <div class="li">累計作答 <b>${a}</b> 題｜答對率 <b>${a?Math.round(c/a*100):0}%</b>｜錯題本 <b>${Object.keys(W).length}</b> 題</div>
 <h2>各標籤答對率</h2>${T.map((t,k)=>ST[k]?`<div class="li">${t}　${ST[k].c}/${ST[k].a}（${Math.round(ST[k].c/ST[k].a*100)}%）</div>`:'').join('')||'<p class="mu">尚無資料</p>'}
 <h2>練習紀錄</h2>${H.length?H.slice().reverse().map(h=>`<div class="li">${h.d}｜${h.t}｜<b>${h.s}/${h.n}</b>（${Math.round(h.s/h.n*100)}%）</div>`).join(''):'<p class="mu">尚無紀錄</p>'}
 <button class="pri" onclick="cl()">關閉</button><button class="sec" onclick="if(confirm('清空所有紀錄與錯題本？')){W={};H=[];ST={};sv();cl();home()}">清空所有紀錄</button></div>`;
 document.body.appendChild(m)}
function cl(){const m=document.getElementById('md');if(m)m.remove()}
function book(){
 const ids=Object.keys(W).map(Number);
 R.innerHTML=`<h1>錯題本</h1><p class="mu">答對後會自動從錯題本移除</p>
 ${ids.length?ids.map(i=>`<div class="li"><span class="tag">${T[Q[i][0]]}</span>　錯 ${W[i]} 次<br>${Q[i][1]}<br><b style="color:var(--ok)">正解：${Q[i][2].split('|')[0]}</b>${ex(i)}</div>`).join('')+`<button class="pri" onclick="start(Object.keys(W).map(Number),'b','錯題本')">練習全部錯題</button><button class="sec" onclick="if(confirm('清空錯題本？')){W={};sv();book()}">清空錯題本</button>`:'<p>目前沒有錯題 👍</p>'}
 <button class="sec" onclick="home()">回首頁</button>`;
}
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(document.getElementById('md')){if(e.key=='Enter'||e.key=='Escape'){e.preventDefault();cl()}return}
 const os=R.querySelectorAll('.o');if(!os.length||!S)return;
 if(/^[1-4]$/.test(e.key)){if(S.done)return;const j=+e.key-1;if(j<os.length){S.p=j;os.forEach((b,i)=>b.classList.toggle('sel',i==j))}}
 else if(e.key=='Enter'){e.preventDefault();if(document.activeElement)document.activeElement.blur();if(S.done)nx();else if(S.p!=null)ans(S.p)}
});
home();
</script></body></html>
